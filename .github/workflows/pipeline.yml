name: Pipeline

on:
  pull_request:

jobs:
  pip_check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: convert
      shell: bash -l {0}
      run: |
        ./.ci_support/convert_linux.sh
        cat environment.yml
        echo -e "channels:\n  - conda-forge\n" > .condarc
    - name: Setup Mambaforge
      id: setup_mambaforge
      continue-on-error: true
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        miniforge-version: latest
        condarc-file: .condarc
        environment-file: environment.yml
    - name: mitigate pip metadata issues
      id: pip_meta
      if: false
      # steps.setup_mambaforge.outcome == 'success'
      shell: bash -l {0}
      timeout-minutes: 30
      continue-on-error: true
      run: |
        mamba install uv-build -y
        pip download --no-binary ":all:" --no-deps --no-build-isolation sim-atlas-toolkit
        ls
        tar -xf sim_atlas_toolkit-*.tar.gz
        ls
        cd sim_atlas_toolkit-*/
        sed -i 's/"tqdm>=4.68.4"/"tqdm>=4.67.3"/g' pyproject.toml
        pip install . --no-deps --no-build-isolation
    - name: Test
      id: pip_check
      if: steps.setup_mambaforge.outcome == 'success'
      shell: bash -l {0}
      timeout-minutes: 30
      continue-on-error: true
      run: |
        pip install ./.ci_support --no-deps --no-build-isolation
        pip check
    - name: Report mamba suggestions on setup or pip check failure
      if: (steps.setup_mambaforge.outcome == 'failure' || steps.pip_check.outcome == 'failure')
      shell: bash {0}
      timeout-minutes: 31
      run: |
        export PATH="$CONDA/bin:$PATH"
        # Fetch and convert main branch environment.yml
        git fetch origin main
        git show origin/main:environment.yml > /tmp/main_environment.yml
        sed -e '/\[win\]/d' -e '/\[macarm\]/d' -e '/\[macos\]/d' /tmp/main_environment.yml > /tmp/main_environment_linux.yml

        # Install main branch environment into a separate conda env
        mamba env create -n main_env -f /tmp/main_environment_linux.yml

        # Convert the main-vs-PR diff into a minimal dependency-only environment file
        # so mamba can highlight any conflict introduced by the current PR.
        diff -u /tmp/main_environment_linux.yml environment.yml > /tmp/mamba_diff.patch || true
        {
          echo "channels:"
          echo "  - conda-forge"
          echo "dependencies:"
          sed -n '/^[+-][[:space:]]/p' /tmp/mamba_diff.patch \
            | sed -E 's/^[+-][[:space:]]//' \
            | sed 's/^/  - /'
        } > /tmp/diff_environment.yml

        echo "Generated diff environment:"
        cat /tmp/diff_environment.yml

        # Update the main_env with the diff environment.yml to see if there are any conflicts
        mamba env update -n main_env -f /tmp/diff_environment.yml || true

    - name: Fail if setup or pip check failed
      if: steps.setup_mambaforge.outcome == 'failure' || steps.pip_check.outcome == 'failure'
      run: exit 1

  linux_x64_test_environment:
    needs: [pip_check]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: convert
      shell: bash -l {0}
      run: |
        ./.ci_support/convert_linux.sh
        cat environment.yml
        echo -e "channels:\n  - conda-forge\n" > .condarc
    - name: Setup Mambaforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        miniforge-version: latest
        condarc-file: .condarc
        environment-file: environment.yml

  linux_x64_build_environment:
    needs: [linux_x64_test_environment]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Conda config
      run: echo -e "channels:\n  - conda-forge\n" > .condarc
    - name: Setup Mambaforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        miniforge-version: latest
        condarc-file: .condarc
        environment-file: .ci_support/environment.yml
    - name: Test
      shell: bash -l {0}
      timeout-minutes: 30
      run: |
        ./.ci_support/convert_linux.sh
        cat environment.yml
        python .ci_support/dryrun.py environment.yml env-linux-x64.yml 
    - uses: actions/upload-artifact@v4
      with:
        name: env-linux-x64.yml
        path: env-linux-x64.yml

  linux_x64_install_core_to_environment:
    needs: [linux_x64_test_environment]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Conda config
      run: echo -e "channels:\n  - conda-forge\n" > .condarc
    - name: Setup Mambaforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.12"
        miniforge-version: latest
        condarc-file: .condarc
        environment-file: environment.yml
    - uses: actions/checkout@v4
      with:
        repository: pyiron/pyiron_core
        path: pyiron_core
    - name: install pyiron_core
      run: |
        cd pyiron_core;
        ls;
        conda run --name test pip install . --no-deps --no-build-isolation

  jupyter_docker_build_environment:
    needs: [pip_check]
    runs-on: ubuntu-latest
    steps:
    - name: Get current date
      id: date
      run: echo "::set-output name=date::$(date +%F)"
    - uses: actions/checkout@v4
    - name: Build pyiron/mpie_cmti
      timeout-minutes: 15
      run: |
        docker build -t pyiron/mpie_cmti:latest .
    - run: docker images
    - run: mkdir -p environment; chmod 777 environment
    - run: docker run -v $(pwd)/environment:/home/jovyan/ --rm pyiron/mpie_cmti /bin/bash -c 'source /opt/conda/bin/activate; conda env export > /home/jovyan/env-jupyter-docker-$(date +%F).yml;'
    - name: test pyiron/cmti
      run: |
        docker run -v $(pwd)/test:/home/jovyan/test --rm pyiron/mpie_cmti /bin/bash -c 'source /opt/conda/bin/activate; python test/import.py;'
    - uses: actions/upload-artifact@v4
      with:
        name: env-jupyter-docker.yml
        path: environment/env-jupyter-docker-${{ steps.date.outputs.date }}.yml

  autobot:
    needs: [linux_x64_build_environment,jupyter_docker_build_environment,linux_x64_install_core_to_environment]
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Ignore broken packages
        shell: bash -l {0}
        run: python .ci_support/checktitle.py "${{ github.event.pull_request.title }}"
      - name: Enable auto-merge for bot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
